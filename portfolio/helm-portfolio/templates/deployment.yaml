---
# 1. The Backend Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-backend
  template:
    metadata:
      labels:
        app: ai-backend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      env:
        OLLAMA_URL: ollama-service
      containers:
      - name: backend
        image: {{ .Values.portfolioService.backendImage }}
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ai-backend-service # THIS is what Nginx is looking for
spec:
  selector:
    app: ai-backend
  ports:
  - port: 8000
    targetPort: 8000

---
# 2. The Frontend Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-frontend
  template:
    metadata:
      labels:
        app: portfolio-frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
      - name: frontend
        image: {{ .Values.portfolioService.frontendImage }}
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-frontend-service
spec:
  type: LoadBalancer # K3s handles this automatically
  selector:
    app: portfolio-frontend
  ports:
  - port: 80
    targetPort: 80
